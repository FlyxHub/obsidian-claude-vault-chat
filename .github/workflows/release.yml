# Builds the plugin and creates a draft GitHub release when a version tag is pushed.
# The tag must equal the version in manifest.json, with no "v" prefix (Obsidian requires this).
name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write
  id-token: write # signs the build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches manifest.json
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./manifest.json').version")"

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Lets anyone verify the release files were built here: gh attestation verify main.js -R <repo>
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes main.js manifest.json styles.css
